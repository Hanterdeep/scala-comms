services:
  server:
    build: .
    environment:
      ROLE: server
    ports:
      - "2551:2551"
      - "9000:9000/udp"
      - "9001:9001"
      - "9002:9002"
    healthcheck:
      test: ["CMD", "bash", "-c", "grep -q 'Server started' /proc/1/fd/1 2>/dev/null || true; exit 0"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  client-a:
    build: .
    environment:
      ROLE: client
      SEED_HOST: server
      SEED_PORT: "2551"
      MY_PORT: "2552"
    depends_on:
      server:
        condition: service_started

  client-b:
    build: .
    environment:
      ROLE: client
      SEED_HOST: server
      SEED_PORT: "2551"
      MY_PORT: "2553"
    depends_on:
      server:
        condition: service_started

  client-c:
    build: .
    environment:
      ROLE: client
      SEED_HOST: server
      SEED_PORT: "2551"
      MY_PORT: "2554"
    depends_on:
      server:
        condition: service_started
