name: Ghetto NAT integration

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ghetto-nat:
    name: Double NAT with short UDP timeouts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Build snapshot jars
        run: |
          export APP_VERSION="0.1.0-pr${{ github.event.pull_request.number || 'local' }}-SNAPSHOT"
          sbt -batch assembly
          sbt -batch "clientAssembly"
          mkdir -p target
          cp target/scala-2.13/scala-communicator-server-*.jar target/ || true
          cp target/scala-communicator-client-*.jar target/ || true

      - name: Run ghetto NAT test
        run: |
          chmod +x scripts/ghetto-nat-test.sh
          ./scripts/ghetto-nat-test.sh
