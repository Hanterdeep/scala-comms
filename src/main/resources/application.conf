akka {
  loglevel = "INFO"
  actor {
    provider = cluster
    serialization-bindings {
      "com.example.comm.protocol.Envelope" = jackson-json
    }
  }
  remote.artery {
    canonical.hostname = "127.0.0.1"
    canonical.port = 2551
  }
  cluster {
    seed-nodes = ["akka://Communicator@127.0.0.1:2551"]
    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
  }
}
