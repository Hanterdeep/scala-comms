# Multi-VM NAT test topology
#
#   [server] ---- public (172.30.0.0/16) ---- [nat-gw-a] ---- private-a (10.10.0.0/24) ---- [client-a]
#                                     \---- [nat-gw-b] ---- private-b (10.20.0.0/24) ---- [client-b]
#                                     \---- [nat-gw-c] ---- private-c (10.30.0.0/24) ---- [client-c]
#
# Obstacles via tc on the NAT gateways:
#   - Client A: 50ms latency, 20ms jitter, 2% loss
#   - Client B: 80ms latency, 30ms jitter, 5% loss
#   - Client C: 120ms latency, 40ms jitter, 8% loss

services:
  server:
    build: .
    environment:
      ROLE: server
    networks:
      public:
        ipv4_address: 172.30.0.10
    ports:
      - "2551:2551"
    command: ["java", "-jar", "/app/server.jar"]

  nat-gw-a:
    image: alpine:3.19
    cap_add: [NET_ADMIN]
    command: >
      sh -c "
        apk add --no-cache iptables iproute2 &&
        echo 1 > /proc/sys/net/ipv4/ip_forward &&
        iptables -t nat -A POSTROUTING -s 10.10.0.0/24 -j MASQUERADE &&
        iptables -A FORWARD -s 10.10.0.0/24 -j ACCEPT &&
        iptables -A FORWARD -d 10.10.0.0/24 -m state --state RELATED,ESTABLISHED -j ACCEPT &&
        PUBIF=$$(ip -o addr show | awk '/172.30/ {print $$2}') &&
        tc qdisc add dev $$PUBIF root netem delay 50ms 20ms loss 2% || true &&
        sleep infinity
      "
    networks:
      public:
        ipv4_address: 172.30.0.100
      private-a:
        ipv4_address: 10.10.0.1

  client-a:
    build: .
    environment:
      ROLE: client
      SEED_HOST: 172.30.0.10
      SEED_PORT: "2551"
      MY_PORT: "2552"
    networks:
      private-a:
        ipv4_address: 10.10.0.10
    depends_on: [nat-gw-a]
    command: ["java", "-cp", "/app/client.jar", "com.example.comm.client.ClientApp", "172.30.0.10", "2551", "2552"]

  nat-gw-b:
    image: alpine:3.19
    cap_add: [NET_ADMIN]
    command: >
      sh -c "
        apk add --no-cache iptables iproute2 &&
        echo 1 > /proc/sys/net/ipv4/ip_forward &&
        iptables -t nat -A POSTROUTING -s 10.20.0.0/24 -j MASQUERADE &&
        iptables -A FORWARD -s 10.20.0.0/24 -j ACCEPT &&
        iptables -A FORWARD -d 10.20.0.0/24 -m state --state RELATED,ESTABLISHED -j ACCEPT &&
        PUBIF=$$(ip -o addr show | awk '/172.30/ {print $$2}') &&
        tc qdisc add dev $$PUBIF root netem delay 80ms 30ms loss 5% || true &&
        sleep infinity
      "
    networks:
      public:
        ipv4_address: 172.30.0.101
      private-b:
        ipv4_address: 10.20.0.1

  client-b:
    build: .
    environment:
      ROLE: client
      SEED_HOST: 172.30.0.10
      SEED_PORT: "2551"
      MY_PORT: "2553"
    networks:
      private-b:
        ipv4_address: 10.20.0.10
    depends_on: [nat-gw-b]
    command: ["java", "-cp", "/app/client.jar", "com.example.comm.client.ClientApp", "172.30.0.10", "2551", "2553"]

  nat-gw-c:
    image: alpine:3.19
    cap_add: [NET_ADMIN]
    command: >
      sh -c "
        apk add --no-cache iptables iproute2 &&
        echo 1 > /proc/sys/net/ipv4/ip_forward &&
        iptables -t nat -A POSTROUTING -s 10.30.0.0/24 -j MASQUERADE &&
        iptables -A FORWARD -s 10.30.0.0/24 -j ACCEPT &&
        iptables -A FORWARD -d 10.30.0.0/24 -m state --state RELATED,ESTABLISHED -j ACCEPT &&
        PUBIF=$$(ip -o addr show | awk '/172.30/ {print $$2}') &&
        tc qdisc add dev $$PUBIF root netem delay 120ms 40ms loss 8% || true &&
        sleep infinity
      "
    networks:
      public:
        ipv4_address: 172.30.0.102
      private-c:
        ipv4_address: 10.30.0.1

  client-c:
    build: .
    environment:
      ROLE: client
      SEED_HOST: 172.30.0.10
      SEED_PORT: "2551"
      MY_PORT: "2554"
    networks:
      private-c:
        ipv4_address: 10.30.0.10
    depends_on: [nat-gw-c]
    command: ["java", "-cp", "/app/client.jar", "com.example.comm.client.ClientApp", "172.30.0.10", "2551", "2554"]

networks:
  public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
  private-a:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1
  private-b:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
          gateway: 10.20.0.1
  private-c:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.0.0/24
          gateway: 10.30.0.1
